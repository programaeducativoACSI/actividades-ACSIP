<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osaka Arcade - Dinámicas</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Press Start 2P', cursive; transition: background 0.5s;
        }
        #main-menu { text-align: center; margin-top: 40px; }
        .game-section { display: none; width: 95%; max-width: 500px; text-align: center; margin-top: 20px; }
        
        /* Botones configurables */
        .btn-game { 
            display: block; width: 280px; margin: 15px auto; padding: 15px;
            border: none; cursor: pointer; font-family: 'Press Start 2P';
            font-size: 0.5rem; box-shadow: 4px 4px 0px #000;
        }
        .back-link { position: fixed; top: 15px; left: 15px; text-decoration: none; font-size: 0.4rem; }

        /* Contenedores */
        .panel { border: 6px solid #000; padding: 20px; background: rgba(0,0,0,0.1); border-radius: 10px; }
        #hintBox { font-size: 0.4rem; text-align: left; line-height: 1.8; margin-bottom: 15px; }
        input { width: 80%; padding: 10px; font-family: 'Press Start 2P'; font-size: 0.5rem; margin-bottom: 10px; }
        
        /* Memorama */
        #memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { height: 80px; background: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.3rem; border: 2px solid #fff; overflow: hidden; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .card.flipped img { display: block; }
        .card.flipped span { display: block; }
        .card span { display: none; color: #000; }

        /* Puzzle */
        #puzzle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: 300px; height: 300px; margin: 0 auto; border: 4px solid #000; }
        .tile { background-size: 300px 300px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .tile.empty { background: #eee !important; cursor: default; }
    </style>
</head>
<body>

    <a href="index.html" id="btn-regresar" class="back-link">VOLVER</a>

    <div id="main-menu">
        <h1 id="titulo-principal" style="font-size: 0.8rem;">DINÁMICAS MUSEO</h1>
        <button class="btn-game" onclick="runTrivia()">1. ADIVINA</button>
        <button class="btn-game" onclick="runMemory()">2. MEMORAMA</button>
        <button class="btn-game" onclick="runPuzzle()">3. PUZZLE</button>
    </div>

    <div id="view-trivia" class="game-section">
        <button onclick="showHome()" style="font-size: 0.3rem;">ATRÁS</button>
        <div class="panel">
            <div id="hintBox"></div>
            <input type="text" id="ansInput" placeholder="RESPUESTA...">
            <button class="btn-game" style="width: 100%;" onclick="checkAns()">VALIDAR</button>
            <button id="btn-next-hint" class="btn-game" style="width: 100%;" onclick="nextHint()">OTRA PISTA</button>
        </div>
    </div>

    <div id="view-memory" class="game-section">
        <button onclick="showHome()" style="font-size: 0.3rem;">ATRÁS</button>
        <div id="memory-grid"></div>
    </div>

    <div id="view-puzzle" class="game-section">
        <button onclick="showHome()" style="font-size: 0.3rem;">ATRÁS</button>
        <div id="puzzle-grid"></div>
    </div>

<script>
    // 1. Aseguramos que el nombre de la variable sea el mismo que usamos en el fetch
    const URL_DINAMICAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTPf6KsrFzsD6zY57ugk3fiqixmZKtIXauOM8x16xQZq-5gY_HzlNmM1EYk9QtnGmaBJQvQf3walml/pub?output=csv';

    let poolTrivia = [], poolMemory = [], poolPuzzle = [];
    let curObj, curHintIdx = 0;

    async function init() {
        try {
            // CORRECCIÓN: Usamos URL_DINAMICAS aquí
            const res = await fetch(URL_DINAMICAS + '&cache=' + Date.now()); 
            const csv = await res.text();
            const rows = csv.split(/\r?\n/).filter(r => r.trim() !== "").slice(1);
            
            const clean = (v) => v ? v.replace(/^"|"$/g, "").trim() : "";

            // --- 1. CONFIGURACIÓN VISUAL (Fila 2 / Índice 0 de rows) ---
            const cfg = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            
            // Colores de fondo y título
            document.body.style.backgroundColor = clean(cfg[6]); // G2
            const titulo = document.getElementById('titulo-principal');
            if(titulo) titulo.style.color = clean(cfg[7]); // H2
            
            // Colores de botones (I2 y J2)
            const colorTxtBtn = clean(cfg[8]);
            const colorBgBtn = clean(cfg[9]);
            const btns = document.querySelectorAll('.btn-game, .control-btn, .back-btn, .back-link');
            btns.forEach(b => {
                b.style.color = colorTxtBtn;
                b.style.backgroundColor = colorBgBtn;
            });

            // Texto del botón regresar (K2)
            const btnRegresar = document.getElementById('btn-regresar');
            if(btnRegresar) btnRegresar.innerText = clean(cfg[10]) || "VOLVER";

            // COLOR DE INSTRUCCIONES Y PISTAS (L2)
            const colorInstrucciones = clean(cfg[11]);
            // Esta función aplicará el color L2 a los textos cada que cambien
            window.applyInstructionColor = () => {
                const textos = document.querySelectorAll('#hintBox, .hint-text, .card span');
                textos.forEach(t => {
                    t.style.color = colorInstrucciones;
                });
            };

            // --- 2. PROCESAMIENTO DE FILAS ---
            // Limpiamos los pools antes de llenar para evitar duplicados
            poolTrivia = []; poolMemory = []; poolPuzzle = [];
            
            rows.forEach((row) => {
                const cols = row.split(/,(?=(?:(?:[^      ]*"){2})*[^"]*$)/);
                
                // Trivia (A y B)
                const p = clean(cols[0]), r = clean(cols[1]);
                if(r) {
                    let t = poolTrivia.find(x => x.res === r);
                    if(!t) { t = { res: r, pistas: [] }; poolTrivia.push(t); }
                    if(p) t.pistas.push(p);
                }

                // Memorama (C y D)
                const imgM = clean(cols[2]), txtM = clean(cols[3]);
                if(imgM && txtM) poolMemory.push({ img: convert(imgM), txt: txtM });

                // Puzzle (E)
                const imgP = clean(cols[4]);
                if(imgP) poolPuzzle.push(convert(imgP));
            });

            console.log("Sistema Arcade listo.");
            applyInstructionColor(); // Aplicar color inicial

        } catch(e) { console.error("Error de carga:", e); }
    }

    function convert(url) {
        if (!url || !url.includes('drive.google.com')) return url;
        let id = "";
        if (url.includes('id=')) {
            id = url.split('id=')[1].split('&')[0];
        } else if (url.includes('/file/d/')) {
            id = url.split('/file/d/')[1].split('/')[0];
        }
        return id ? `https://drive.google.com/uc?export=view&id=${id}` : url;
    }

    function showHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.querySelectorAll('.game-section').forEach(s => s.style.display = 'none');
    }

    function runTrivia() {
        if(poolTrivia.length === 0) return;
        curObj = poolTrivia[Math.floor(Math.random() * poolTrivia.length)];
        curHintIdx = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('view-trivia').style.display = 'block';
        document.getElementById('hintBox').innerHTML = `PISTA 1:<br>${curObj.pistas[0]}`;
        document.getElementById('ansInput').value = "";
        if(window.applyInstructionColor) window.applyInstructionColor();
    }

    function nextHint() {
        if(curHintIdx < curObj.pistas.length - 1) {
            curHintIdx++;
            document.getElementById('hintBox').innerHTML += `<br><br>PISTA ${curHintIdx+1}:<br>${curObj.pistas[curHintIdx]}`;
            if(window.applyInstructionColor) window.applyInstructionColor();
        }
    }

    function checkAns() {
        const user = document.getElementById('ansInput').value.trim().toLowerCase();
        if(user === curObj.res.toLowerCase()) { 
            alert("¡CORRECTO!"); 
            runTrivia(); 
        } else { 
            alert("ERROR, SIGUE INTENTANDO"); 
        }
    }

    // --- (Lógicas de Memorama y Puzzle se mantienen igual) ---
    // Solo recuerda llamar a applyInstructionColor() dentro de runMemory() 
    // para que los textos de las cartas también tomen el color L2.

    window.onload = init;
</script>
</body>
</html>
