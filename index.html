<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Osaka Vision Pro - Consola de Juegos</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS RETRO GENERALES --- */
        :root {
            --color-rojo: #D04F2C; --color-amarillo: #D9AC36;
            --color-cafe: #431E15; --color-crema: #fffaf0;
            --color-oro: #FFD700; --color-madera: #8d6e63;
        }

        body { 
            background: #1a1a1a; color: #fff; 
            font-family: 'Press Start 2P', cursive; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; margin: 0; padding: 20px; 
        }

        /* --- MENÚ PRINCIPAL --- */
        #main-menu { text-align: center; margin-top: 50px; }
        .menu-title { font-size: 1rem; color: var(--color-rojo); text-shadow: 2px 2px #000; margin-bottom: 30px; }
        .menu-btn { 
            background: var(--color-madera); color: white; 
            border: 4px solid var(--color-cafe); padding: 15px; 
            font-family: 'Press Start 2P'; font-size: 0.5rem; 
            cursor: pointer; width: 80%; max-width: 300px; 
            margin: 10px auto; display: block; 
            box-shadow: 5px 5px 0px #000; transition: all 0.2s;
        }
        .menu-btn:hover { background: var(--color-amarillo); color: var(--color-cafe); }

        /* --- CONTENEDORES DE JUEGO --- */
        .game-section { display: none; width: 95%; max-width: 500px; text-align: center; }
        .retro-panel { border: 10px solid #5d4037; padding: 15px; background: #000; border-radius: 20px; box-shadow: 0 0 20px #000; }
        
        .back-btn { background: var(--color-rojo); color: white; border: none; padding: 5px; font-family: 'Press Start 2P'; font-size: 0.3rem; cursor: pointer; margin-bottom: 10px; }
        .game-title { color: var(--color-oro); font-size: 0.6rem; margin-bottom: 15px; }

        input { width: 80%; padding: 10px; margin: 10px 0; font-family: 'Press Start 2P'; font-size: 12px; background: #222; color: #fff; border: 2px solid var(--color-oro); }
        .hint-text { color: #0f0; font-size: 10px; min-height: 80px; text-align: left; line-height: 1.6; border: 1px solid #333; padding: 5px; background: #111;}
        .control-btn { background: var(--color-amarillo); border: none; padding: 10px; font-family: 'Press Start 2P'; font-size: 0.35rem; cursor: pointer; margin: 5px; box-shadow: 3px 3px 0px #000; }

        #memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .card { 
            background: var(--color-madera); height: 70px; 
            border-radius: 8px; border: 2px solid white;
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            font-size: 0.3rem; color: transparent; text-align: center;
            transition: transform 0.3s; overflow: hidden;
        }
        .card.flipped { background: var(--color-crema); color: var(--color-cafe); transform: rotateY(180deg); border: 2px solid var(--color-oro); }
        .card.matched { background: #80B0A4; color: white; border: 2px solid #0f0; cursor: default; }

        #puzzle-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; 
            width: 300px; height: 300px; margin: 10px auto; 
            background: #333; border: 2px solid var(--color-oro);
        }
        .puzzle-piece { 
            background-size: 300px 300px; 
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
        }
        .puzzle-piece.empty { background: white !important; cursor: default; }
    </style>
</head>
<body>

    <a href="index.html" style="position:fixed; top:10px; left:10px; color:var(--color-crema); text-decoration:none; font-size:0.4rem; z-index:1000;"><< TV</a>

    <div id="main-menu">
        <h1 class="menu-title">OSAKA 1969 - ARCADE</h1>
        <button class="menu-btn" onclick="showGame('trivia')">1. ¿QUIÉN ES?</button>
        <button class="menu-btn" onclick="showGame('memory')">2. MEMORAMA</button>
        <button class="menu-btn" onclick="showGame('puzzle')">3. ROMPECABEZAS</button>
    </div>

    <div id="game-trivia" class="game-section">
        <button class="back-btn" onclick="showMenu()">SALIR</button>
        <div class="retro-panel">
            <h2 class="game-title">¿QUIÉN ES?</h2>
            <div id="trivia-hints" class="hint-text">Cargando pistas...</div>
            <input type="text" id="trivia-answer" placeholder="TU RESPUESTA...">
            <div>
                <button class="control-btn" onclick="checkTrivia()">LISTO</button>
                <button class="control-btn" id="btn-next-hint" onclick="revealNextHint()">+ PISTA</button>
            </div>
        </div>
    </div>

    <div id="game-memory" class="game-section">
        <button class="back-btn" onclick="showMenu()">SALIR</button>
        <div class="retro-panel">
            <h2 class="game-title">MEMORAMA</h2>
            <div id="memory-grid"></div>
        </div>
    </div>

    <div id="game-puzzle" class="game-section">
        <button class="back-btn" onclick="showMenu()">SALIR</button>
        <div class="retro-panel">
            <h2 class="game-title">ROMPECABEZAS</h2>
            <div id="puzzle-grid"></div>
        </div>
    </div>

<script>
    // --- ENLACE UNIFICADO ---
    const URL_DATA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTPf6KsrFzsD6zY57ugk3fiqixmZKtIXauOM8x16xQZq-5gY_HzlNmM1EYk9QtnGmaBJQvQf3walml/pub?output=csv';

    let triviaData = [];
    let muralesData = [];

    async function loadAllGamesData() {
        try {
            const res = await fetch(URL_DATA);
            const csv = await res.text();
            const rows = csv.split(/\r?\n/).filter(r => r.trim() !== "").slice(2);
            
            processData(rows);
            console.log("Carga exitosa. Trivias:", triviaData.length, "Murales:", muralesData.length);
        } catch (e) { console.error("Error cargando juegos:", e); }
    }

    const clean = (v) => v ? v.replace(/^"|"$/g, "").trim() : "";

    function processData(rows) {
        triviaData = [];
        muralesData = [];
        let currentTrivia = null;

        rows.forEach((row, i) => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            
            // 1. Procesar Murales (Columnas B=1 y F=5)
            const tituloMural = clean(cols[1]);
            const imgMural = convertDriveLink(clean(cols[5]));
            if(tituloMural && imgMural.includes('http')) {
                muralesData.push({ titulo: tituloMural, imagen: imgMural });
            }

            // 2. Procesar Trivia (Columnas L=11 y O=14)
            const pista = clean(cols[11]);
            const respuesta = clean(cols[14]);
            if(respuesta !== "") {
                if(!currentTrivia || currentTrivia.respuesta !== respuesta) {
                    currentTrivia = { respuesta: respuesta, pistas: [] };
                    triviaData.push(currentTrivia);
                }
                if(pista !== "" && currentTrivia.pistas.length < 5) {
                    currentTrivia.pistas.push(pista);
                }
            }
        });
    }

    function convertDriveLink(url) {
        if (url.includes('drive.google.com') && url.includes('id=')) {
            const id = url.split('id=')[1].split('&')[0];
            return `https://drive.google.com/uc?export=view&id=${id}`;
        }
        return url;
    }

    function showMenu() {
        document.getElementById('main-menu').style.display = 'block';
        document.querySelectorAll('.game-section').forEach(s => s.style.display = 'none');
    }

    function showGame(gameType) {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById(`game-${gameType}`).style.display = 'block';
        if(gameType === 'trivia') initTrivia();
        if(gameType === 'memory') initMemory();
        if(gameType === 'puzzle') initPuzzle();
    }

    // --- LÓGICA JUEGOS ---
    let curTrivia, hintIdx;
    function initTrivia() {
        if(triviaData.length === 0) return alert("Sin datos.");
        curTrivia = triviaData[Math.floor(Math.random() * triviaData.length)];
        hintIdx = 0;
        document.getElementById('trivia-hints').innerHTML = `• Pista 1: ${curTrivia.pistas[0]}`;
        document.getElementById('btn-next-hint').disabled = false;
        document.getElementById('btn-next-hint').style.opacity = "1";
        document.getElementById('trivia-answer').value = "";
    }

    function revealNextHint() {
        if(hintIdx < curTrivia.pistas.length - 1) {
            hintIdx++;
            document.getElementById('trivia-hints').innerHTML += `<br>• Pista ${hintIdx+1}: ${curTrivia.pistas[hintIdx]}`;
            if(hintIdx === curTrivia.pistas.length - 1) {
                document.getElementById('btn-next-hint').disabled = true;
                document.getElementById('btn-next-hint').style.opacity = "0.5";
            }
        }
    }

    function checkTrivia() {
        const guess = document.getElementById('trivia-answer').value.trim().toLowerCase();
        if(guess === curTrivia.respuesta.toLowerCase()) {
            alert("¡CORRECTO!");
            initTrivia();
        } else { alert("INTENTA DE NUEVO"); }
    }

    let flipped = [], matches = 0;
    function initMemory() {
        const grid = document.getElementById('memory-grid');
        grid.innerHTML = ''; flipped = []; matches = 0;
        let sel = [...muralesData].sort(() => 0.5 - Math.random()).slice(0, 6);
        let pairs = [...sel, ...sel].sort(() => 0.5 - Math.random());
        pairs.forEach(m => {
            const c = document.createElement('div');
            c.className = 'card'; c.dataset.title = m.titulo;
            c.innerText = m.titulo; c.onclick = flip;
            grid.appendChild(c);
        });
    }

    function flip() {
        if (flipped.length < 2 && !this.classList.contains('flipped')) {
            this.classList.add('flipped');
            flipped.push(this);
            if (flipped.length === 2) setTimeout(checkM, 1000);
        }
    }

    function checkM() {
        if (flipped[0].dataset.title === flipped[1].dataset.title) {
            flipped.forEach(c => c.classList.add('matched'));
            matches++;
            if (matches === 6) alert("¡GANASTE!");
        } else { flipped.forEach(c => c.classList.remove('flipped')); }
        flipped = [];
    }

    let pPieces = [], eIdx = 8;
    function initPuzzle() {
        const m = muralesData[Math.floor(Math.random() * muralesData.length)];
        pPieces = [...Array(8).keys(), 'empty'].sort(() => 0.5 - Math.random());
        eIdx = pPieces.indexOf('empty');
        renderP(m.imagen);
    }

    function renderP(url) {
        const g = document.getElementById('puzzle-grid');
        g.innerHTML = '';
        pPieces.forEach((p, i) => {
            const d = document.createElement('div');
            d.className = 'puzzle-piece' + (p === 'empty' ? ' empty' : '');
            if(p !== 'empty') {
                d.style.backgroundImage = `url(${url})`;
                d.style.backgroundPosition = `-${(p % 3) * 100}px -${Math.floor(p / 3) * 100}px`;
                d.onclick = () => moveP(i, url);
            }
            g.appendChild(d);
        });
    }

    function moveP(i, url) {
        const ady = [i-1, i+1, i-3, i+3];
        if (i%3 === 0) ady[0] = -1; if (i%3 === 2) ady[1] = -1;
        if (ady.includes(eIdx)) {
            [pPieces[i], pPieces[eIdx]] = [pPieces[eIdx], pPieces[i]];
            eIdx = i; renderP(url);
            if (pPieces.every((v, k) => v === 'empty' ? k === 8 : v === k)) alert("¡LOGRADO!");
        }
    }

    window.onload = loadAllGamesData;
</script>
</body>
</html>
