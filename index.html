<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osaka Arcade - Dinámicas</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Press Start 2P', cursive; transition: background 0.5s;
        }
        #main-menu { text-align: center; margin-top: 40px; }
        .game-section { display: none; width: 95%; max-width: 500px; text-align: center; margin-top: 20px; }
        
        .btn-game { 
            display: block; width: 280px; margin: 15px auto; padding: 15px;
            border: none; cursor: pointer; font-family: 'Press Start 2P';
            font-size: 0.5rem; box-shadow: 4px 4px 0px #000;
        }
        .back-link { position: fixed; top: 15px; left: 15px; text-decoration: none; font-size: 0.4rem; padding: 5px; border-radius: 5px; }

        .panel { border: 6px solid #000; padding: 20px; background: rgba(0,0,0,0.1); border-radius: 10px; }
        #hintBox { font-size: 0.4rem; text-align: left; line-height: 1.8; margin-bottom: 15px; }
        input { width: 80%; padding: 10px; font-family: 'Press Start 2P'; font-size: 0.5rem; margin-bottom: 10px; }
        
        #memory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { height: 80px; background: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.25rem; border: 2px solid #fff; overflow: hidden; text-align: center; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .card.flipped img { display: block; }
        .card.flipped span { display: block; }
        .card span { display: none; padding: 2px; }

        #puzzle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: 300px; height: 300px; margin: 0 auto; border: 4px solid #000; }
        .tile { background-size: 300px 300px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .tile.empty { background: #eee !important; cursor: default; }
    </style>
</head>
<body>

    <a href="index.html" id="btn-regresar" class="back-link">VOLVER</a>

    <div id="main-menu">
        <h1 id="titulo-principal" style="font-size: 0.8rem;">DINÁMICAS MUSEO</h1>
        <button class="btn-game" onclick="runTrivia()">1. ADIVINA</button>
        <button class="btn-game" onclick="runMemory()">2. MEMORAMA</button>
        <button class="btn-game" onclick="runPuzzle()">3. PUZZLE</button>
    </div>

    <div id="view-trivia" class="game-section">
        <button class="btn-game" onclick="showHome()" style="font-size: 0.3rem; width: auto;">ATRÁS</button>
        <div class="panel">
            <div id="hintBox"></div>
            <input type="text" id="ansInput" placeholder="RESPUESTA...">
            <button class="btn-game" style="width: 100%;" onclick="checkAns()">VALIDAR</button>
            <button id="btn-next-hint" class="btn-game" style="width: 100%;" onclick="nextHint()">OTRA PISTA</button>
        </div>
    </div>

    <div id="view-memory" class="game-section">
        <button class="btn-game" onclick="showHome()" style="font-size: 0.3rem; width: auto;">ATRÁS</button>
        <div id="memory-grid"></div>
    </div>

    <div id="view-puzzle" class="game-section">
        <button class="btn-game" onclick="showHome()" style="font-size: 0.3rem; width: auto;">ATRÁS</button>
        <div id="puzzle-grid"></div>
    </div>

<script>
    const URL_DINAMICAS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTPf6KsrFzsD6zY57ugk3fiqixmZKtIXauOM8x16xQZq-5gY_HzlNmM1EYk9QtnGmaBJQvQf3walml/pub?output=csv';

    let poolTrivia = [], poolMemory = [], poolPuzzle = [];
    let curObj, curHintIdx = 0;
    let colorInstrucciones = "#ffffff";

    async function init() {
        try {
            const res = await fetch(URL_DINAMICAS + '&cache=' + Date.now()); 
            const csv = await res.text();
            const rows = csv.split(/\r?\n/).filter(r => r.trim() !== "").slice(1);
            const clean = (v) => v ? v.replace(/^"|"$/g, "").trim() : "";

            const cfg = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            document.body.style.backgroundColor = clean(cfg[6]); 
            if(document.getElementById('titulo-principal')) document.getElementById('titulo-principal').style.color = clean(cfg[7]); 
            
            const colorTxtBtn = clean(cfg[8]);
            const colorBgBtn = clean(cfg[9]);
            document.querySelectorAll('.btn-game, .back-link').forEach(b => {
                b.style.color = colorTxtBtn;
                b.style.backgroundColor = colorBgBtn;
            });

            if(document.getElementById('btn-regresar')) document.getElementById('btn-regresar').innerText = clean(cfg[10]) || "VOLVER";
            colorInstrucciones = clean(cfg[11]);

            poolTrivia = []; poolMemory = []; poolPuzzle = [];
            rows.forEach((row) => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const p = clean(cols[0]), r = clean(cols[1]);
                if(r) {
                    let t = poolTrivia.find(x => x.res === r);
                    if(!t) { t = { res: r, pistas: [] }; poolTrivia.push(t); }
                    if(p) t.pistas.push(p);
                }
                const imgM = clean(cols[2]), txtM = clean(cols[3]);
                if(imgM && txtM) poolMemory.push({ img: convert(imgM), txt: txtM });
                const imgP = clean(cols[4]);
                if(imgP) poolPuzzle.push(convert(imgP));
            });
            console.log("Sistema Arcade listo.");
        } catch(e) { console.error("Error de carga:", e); }
    }

    function convert(url) {
        if (!url || !url.includes('drive.google.com')) return url;
        let id = "";
        if (url.includes('id=')) id = url.split('id=')[1].split('&')[0];
        else if (url.includes('/file/d/')) id = url.split('/file/d/')[1].split('/')[0].split('?')[0];
        return id ? `https://thumbnail.googleusercontent.com/doc/${id}?sz=w500` : url;
    }

    function applyColors() {
        document.querySelectorAll('#hintBox, .card span').forEach(t => t.style.color = colorInstrucciones);
    }

    function showHome() {
        document.getElementById('main-menu').style.display = 'block';
        document.querySelectorAll('.game-section').forEach(s => s.style.display = 'none');
    }

    function runTrivia() {
        if(poolTrivia.length === 0) return;
        curObj = poolTrivia[Math.floor(Math.random() * poolTrivia.length)];
        curHintIdx = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('view-trivia').style.display = 'block';
        document.getElementById('hintBox').innerHTML = `PISTA 1:<br>${curObj.pistas[0]}`;
        document.getElementById('ansInput').value = "";
        applyColors();
    }

    function nextHint() {
        if(curHintIdx < curObj.pistas.length - 1) {
            curHintIdx++;
            document.getElementById('hintBox').innerHTML += `<br><br>PISTA ${curHintIdx+1}:<br>${curObj.pistas[curHintIdx]}`;
            applyColors();
        }
    }

    function checkAns() {
        if(document.getElementById('ansInput').value.trim().toLowerCase() === curObj.res.toLowerCase()) {
            alert("¡CORRECTO!"); runTrivia();
        } else alert("INTENTA DE NUEVO");
    }

    // --- LÓGICA MEMORAMA ---
    let flipped = [], matches = 0;
    function runMemory() {
        const grid = document.getElementById('memory-grid'); grid.innerHTML = '';
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('view-memory').style.display = 'block';
        flipped = []; matches = 0;
        let sel = [...poolMemory].sort(() => 0.5 - Math.random()).slice(0, 3);
        let gameSet = [];
        sel.forEach(item => {
            gameSet.push({ val: item.txt, type: 'img', content: item.img });
            gameSet.push({ val: item.txt, type: 'txt', content: item.txt });
        });
        gameSet.sort(() => 0.5 - Math.random());
        gameSet.forEach(data => {
            const card = document.createElement('div');
            card.className = 'card'; card.dataset.val = data.val;
            card.innerHTML = data.type === 'img' ? `<img src="${data.content}">` : `<span>${data.content}</span>`;
            card.onclick = function() {
                if(flipped.length < 2 && !this.classList.contains('flipped')) {
                    this.classList.add('flipped'); flipped.push(this);
                    if(flipped.length === 2) setTimeout(checkMem, 1000);
                }
            };
            grid.appendChild(card);
        });
        applyColors();
    }

    function checkMem() {
        if(flipped[0].dataset.val === flipped[1].dataset.val) {
            flipped.forEach(c => c.style.visibility = 'hidden'); matches++;
            if(matches === 3) { alert("¡MEMORAMA COMPLETADO!"); runMemory(); }
        } else flipped.forEach(c => c.classList.remove('flipped'));
        flipped = [];
    }

    // --- LÓGICA PUZZLE ---
    let pItems = [], emptyIdx = 8;
    function runPuzzle() {
        if(poolPuzzle.length === 0) return alert("Sin imágenes de puzzle");
        const img = poolPuzzle[Math.floor(Math.random() * poolPuzzle.length)];
        pItems = [...Array(8).keys(), 'empty'].sort(() => 0.5 - Math.random());
        emptyIdx = pItems.indexOf('empty');
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('view-puzzle').style.display = 'block';
        drawP(img);
    }

    function drawP(url) {
        const g = document.getElementById('puzzle-grid'); g.innerHTML = '';
        pItems.forEach((p, i) => {
            const d = document.createElement('div');
            d.className = 'tile' + (p === 'empty' ? ' empty' : '');
            if(p !== 'empty') {
                d.style.backgroundImage = `url(${url})`;
                d.style.backgroundPosition = `-${(p % 3) * 100}px -${Math.floor(p / 3) * 100}px`;
                d.onclick = () => {
                    const ady = [i-1, i+1, i-3, i+3];
                    if(i%3===0) ady[0]=-1; if(i%3===2) ady[1]=-1;
                    if(ady.includes(emptyIdx)) {
                        [pItems[i], pItems[emptyIdx]] = [pItems[emptyIdx], pItems[i]];
                        emptyIdx = i; drawP(url);
                        if(pItems.every((v, k) => v === 'empty' ? k === 8 : v === k)) alert("¡PUZZLE LOGRADO!");
                    }
                };
            }
            g.appendChild(d);
        });
    }

    window.onload = init;
</script>
</body>
</html>
